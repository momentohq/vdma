[workspace]
resolver = "2"
members = [
    "crates/configuration",
    "crates/dma-libfabric",
    "crates/dma-traits",
    "crates/libfabric-sys",
    "crates/module",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Local crates
configuration        = { path = "crates/configuration" }
dma-libfabric        = { path = "crates/dma-libfabric" }
dma-traits           = { path = "crates/dma-traits" }
libfabric-sys        = { path = "crates/libfabric-sys" }

# External
crc-fast             = { version = "1.10", default-features = false, features = ["std"] }
linkme               = { version = "0.3" }
serde                = { version = "1", features = ["derive"] }
thiserror            = { version = "2" }
tokio                = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
toml                 = { version = "1.1" }
tracing              = { version = "0.1" }
tracing-cache        = { version = "0.2" }
tracing-console-host = { version = "0.2" }
valkey-module        = { path = "/Users/kenny/gits/valkeymodule-rs" }
valkey-module-macros = { path = "/Users/kenny/gits/valkeymodule-rs/valkeymodule-rs-macros" }

[workspace.lints.rust]
# Deny all warnings; priority -1 lets the specific lints below override the group.
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
expect_used        = "deny"
panic_in_result_fn = "deny"
todo               = "deny"
unimplemented      = "deny"
unwrap_used        = "deny"
